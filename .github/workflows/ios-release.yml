name: iOS release (TestFlight)

# 既定ブランチに push したら、本番広告の設定で iOS 版をビルドし、署名して App Store Connect（TestFlight）にアップロードする。
# 審査への提出は App Store Connect で行う（docs/IOS_BUILD.md）。
# 必要な Secrets：IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
on:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'game.js'
      - 'images/**'
      - 'js/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

# アップロードは古いものを取り消して最新だけにする
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: jp.techgym.ichiokuen
      TEAM_ID: GNM3VTX9YG
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Set version
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Mac の Xcode から手動でアップロードするビルド（1, 2, 3…）と重ならないよう、100 を足す
          echo "BUILD_NUMBER=$((RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      # App Store 用なので本番の広告 ID を使う
      - name: Copy web assets into the iOS project (production ads)
        run: |
          ADMOB_MODE=production npm run build
          npx cap sync ios

      - name: Import the distribution certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" | openssl x509 -noout -serial | cut -d= -f2)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # 同じ Bundle ID・証明書の App Store 用プロファイルを使い回す（なければ作る）
      - name: Prepare the provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-profile.js

      # アプリ本体だけを手動署名にする（コマンドラインで指定すると Swift パッケージにもかかってエラーになるため）
      - name: Use manual signing for the app target
        working-directory: ios/App
        run: |
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" App.xcodeproj/project.pbxproj
          grep -c "PROVISIONING_PROFILE_SPECIFIER" App.xcodeproj/project.pbxproj

      - name: Archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$VERSION_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive | tail -60

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -40
          echo "v${VERSION_NAME} (build ${BUILD_NUMBER}) をアップロードした。App Store Connect の TestFlight に 10〜30 分で表示される" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys"
